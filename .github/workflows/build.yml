name: Build and Test
on:
  push:
    tags:
      - v*
    branches:
      - develop
      - main
  pull_request:
permissions:
  contents: read
  pull-requests: read
env:
  __W_SRC_REL: go/src/github.com/RocketChat/airlock
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    # Service containers to run with `container-job`
    #services:
    # none currently

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
          path: ${{ env.__W_SRC_REL }}

      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-docker-action@v4
      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERREGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERREGISTRY_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          secrets: |
            PRIVATE_REPO_ACCESS_KEY=${{ secrets.PRIVATE_REPO_ACCESS_KEY }}
            GOPRIVATE=github.com/RocketChat
          tags: |
            rocketchat/airlock:${{github.sha}}
