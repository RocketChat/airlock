name: Build and Test
on:
  push:
    tags:
      - v*
  pull_request:
permissions:
  contents: read
  pull-requests: read
env:
  __W_SRC_REL: go/src/github.com/RocketChat/airlock
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
          path: ${{ env.__W_SRC_REL }}
      - uses: actions/setup-go@v3
        with:
          go-version: "=1.21.0"
          cache: false
      - name: Build binary
        run: |
          cd $__W_SRC_REL
          go mod tidy
          make build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERREGISTRY_USERNAME }}
          password: ${{ secrets.DOCKERREGISTRY_PASSWORD }}
      - name: Build Docker image
        uses: docker/build-push-action@v3
        with:
          context: ${{ env.__W_SRC_REL }}
          file: ${{ env.__W_SRC_REL }}/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
      - name: Push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ${{ env.__W_SRC_REL }}
          file: ${{ env.__W_SRC_REL }}/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            rocketchat/airlock:${{github.sha}}
