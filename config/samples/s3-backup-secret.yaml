apiVersion: v1
kind: Secret
metadata:
  name: s3-backup-config
  namespace: default
type: Opaque
stringData:
  endpoint: "https://s3.amazonaws.com"
  bucket: "my-mongodb-backups"
  region: "us-east-1"
  accessKeyId: "AKIA..."
  secretAccessKey: "..."
---
# Example MongoDBBackup using the secret
apiVersion: airlock.cloud.rocket.chat/v1alpha1
kind: MongoDBBackup
metadata:
  name: sample-backup
  namespace: default
spec:
  clusterRef:
    name: my-mongo-cluster
    namespace: mongo
  namespaces:
    - database: "myapp"
      collections: ["users", "messages"]
  s3:
    secretRef:
      name: s3-backup-config
    prefix: "mongodb-backups/prod"