---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: mongodbclusters.airlock.cloud.rocket.chat
spec:
  group: airlock.cloud.rocket.chat
  names:
    kind: MongoDBCluster
    listKind: MongoDBClusterList
    plural: mongodbclusters
    singular: mongodbcluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MongoDBCluster is the Schema for the mongodbclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              atlasClusterName:
                description: |-
                  The name of the Atlas cluster.
                  If this is provided, PrefixTemplate, HostTemplate CAN be omitted. Airlock will use the Atlas API to get the details and update the CR.
                type: string
              atlasNodeIpAccessStrategy:
                description: If this is set, along with useAtlasApi, all the kubernetes
                  nodes on the cluster will be added to the Atlas firewall. The only
                  available value right now is "rancher-annotation", which uses the
                  rke.cattle.io/external-ip annotation.
                type: string
              atlasScheduledAutoscaling:
                properties:
                  enabled:
                    default: false
                    description: |-
                      If this is set, the cluster will be enabled for scheduled autoscaling.
                      The way it works is that the cluster will be scaled up to the high tier at the specified time, and scaled down to the lowTier at the specified time.
                    type: boolean
                  highTier:
                    default: M50
                    description: The maximum tier the cluster can scale up to.
                    enum:
                    - M10
                    - M20
                    - M30
                    - M40
                    - M50
                    - M60
                    - M80
                    - M140
                    - M200
                    type: string
                  lowTier:
                    default: M20
                    description: The minimum tier the cluster can scale down to.
                    enum:
                    - M10
                    - M20
                    - M30
                    - M40
                    - M50
                    - M60
                    - M80
                    - M140
                    - M200
                    type: string
                  scaleDownCronExpression:
                    default: 0 20 * * 1-5
                    description: Cron expression for the time the cluster should be
                      scaled down.
                    type: string
                  scaleUpCronExpression:
                    default: 0 6 * * 1-5
                    description: Cron expression for the time the cluster should be
                      scaled up.
                    type: string
                type: object
              connectionSecret:
                description: Secret in which Airlock will look for a ConnectionString
                  or Atlas credentials, that will be used to connect to the cluster.
                  It should have enough privileges to manage users and access. This
                  is not gonna be used by the created users.
                type: string
              connectionSecretNamespace:
                default: airlock-system
                type: string
              hostTemplate:
                description: |-
                  The host with port that clients will receive when requesting credentials.
                  If not provided, useAtlasApi and atlasClusterName must be provided.
                type: string
              optionsTemplate:
                description: |-
                  Extra connection string parameters that will be added to the connection string.
                  If useAtlasApi and atlasClusterName is provided, this will be dynamically populated/updated
                type: string
              prefixTemplate:
                default: mongodb
                description: The prefix used when building the connection string.
                  Defaults to "mongodb"
                type: string
              useAtlasApi:
                description: If this is set, Atlas API will be used instead of the
                  regular mongo auth path.
                type: boolean
              userNamePrefix:
                description: Append this prefix to all default/generated usernames
                  for this cluster. Will be overridden if "username" is specified.
                type: string
            required:
            - connectionSecret
            type: object
          status:
            description: MongoDBClusterStatus defines the observed state of MongoDBCluster
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            required:
            - conditions
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
