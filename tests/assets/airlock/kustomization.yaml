apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../config/crd
- ../../../config/rbac
- ../../../config/manager
# - namespace.yaml

namespace: airlock-system

images:
  # uses another layer of kustomization
- name: rocketchat/airlock
  newName: airlock
  newTag: local

namePrefix: airlock-

configMapGenerator:
  - name: airlock-config
    files:
      - config.yaml
      

patches:
- path: image-pull-policy.yaml