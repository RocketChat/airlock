apiVersion: v1
kind: Pod
metadata:
  name: portmaster-backup
  namespace: default
  labels:
    app: portmaster-backup
spec:
  restartPolicy: Never
  containers:
    - name: portmaster
      # image: rocketchat/portmaster:00d1a8282094cbfffafca03d2059fcd65d6b5ad4
      image: portmaster-v2:local
      imagePullPolicy: IfNotPresent
      args:
        - backup
        - --log-format=pretty
        - -u
        - -d
        - --split=true
        - --chunk=100Mi
        - -r
        - backups
        - /backups
      env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: portmaster-mongodb-access-request
              key: connectionString
        - name: DATABASE_NAME
          value: "test"
        - name: DESTINATION_BUCKET
          value: ${DESTINATION_BUCKET}
        - name: DESTINATION_BUCKET_REGION
          value: ${DESTINATION_BUCKET_REGION}
        - name: DESTINATION_BUCKET_ACCESS_KEY_ID
          value: ${DESTINATION_BUCKET_ACCESS_KEY_ID}
        - name: DESTINATION_BUCKET_SECRET_ACCESS_KEY
          value: ${DESTINATION_BUCKET_SECRET_ACCESS_KEY}
