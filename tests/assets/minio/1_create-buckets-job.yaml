apiVersion: batch/v1
kind: Job
metadata:
  name: create-minio-buckets
  namespace: minio-tenant
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-buckets
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for MinIO to be ready..."
          until mc --insecure alias set myminio https://myminio-hl.minio-tenant.svc.cluster.local:9000 minio minio123; do
            echo "MinIO not ready yet, retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Creating buckets..."
          mc --insecure mb myminio/backups --ignore-existing
          
          echo "Buckets created successfully:"
          mc --insecure ls myminio/
          
          echo "Setting bucket policies..."
          mc --insecure anonymous set download myminio/backups
          
          echo "Bucket setup complete!"